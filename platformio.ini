; PlatformIO configuration for ESP32-S3 + Edge Impulse FOMO
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -DEI_DSP_IMAGE_BUFFER_STATIC_SIZE=1024
    -DCONFIG_FREERTOS_HZ=1000
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN_S3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    espressif/esp32-camera

extra_scripts = post:post_upload.py

monitor_speed = 115200